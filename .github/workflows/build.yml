name: Build Matter Panel Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      board:
        description: 'Target board'
        required: true
        default: 'xiao_esp32c6'
        type: choice
        options:
          - xiao_esp32c6
          - esp32s3_box3
      channel_count:
        description: 'Channel count'
        required: true
        default: '4'
        type: choice
        options:
          - '2'
          - '4'

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.1
    env:
      ESP_MATTER_PATH: /root/esp-matter
      IDF_PATH: /opt/esp/idf
    steps:
      - uses: actions/checkout@v4

      - name: Cache esp-matter
        id: cache-esp-matter
        uses: actions/cache@v4
        with:
          path: /root/esp-matter
          key: esp-matter-v5.2-${{ runner.os }}-v5
          restore-keys: |
            esp-matter-v5.2-${{ runner.os }}-

      - name: Install esp-matter
        if: steps.cache-esp-matter.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/espressif/esp-matter.git $ESP_MATTER_PATH
          cd $ESP_MATTER_PATH
          git submodule update --init --depth 1 connectedhomeip
          # Run bootstrap with only esp32 platform to avoid extra deps
          cd connectedhomeip/connectedhomeip
          source scripts/bootstrap.sh -p esp32
          cd ../..
          # Run install.sh skipping bootstrap (already done) and host tools
          ./install.sh --no-host-tool --no-bootstrap

      - name: Set channel count
        run: |
          sed -i 's/#define CHANNEL_COUNT 4/#define CHANNEL_COUNT ${{ inputs.channel_count }}/' esp32-firmware/main/app_main.cpp

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          . $ESP_MATTER_PATH/export.sh
          cd esp32-firmware
          idf.py set-target ${{ inputs.board == 'esp32s3_box3' && 'esp32s3' || 'esp32c6' }}
          idf.py build

      - name: Collect artifacts
        run: |
          mkdir -p dist/${{ inputs.board }}_${{ inputs.channel_count }}ch
          cp esp32-firmware/build/bootloader/bootloader.bin dist/${{ inputs.board }}_${{ inputs.channel_count }}ch/
          cp esp32-firmware/build/partition_table/partition-table.bin dist/${{ inputs.board }}_${{ inputs.channel_count }}ch/
          cp esp32-firmware/build/matter_panel.bin dist/${{ inputs.board }}_${{ inputs.channel_count }}ch/firmware.bin
          echo '{"version":"${{ github.ref_name }}","board":"${{ inputs.board }}","channel_count":${{ inputs.channel_count }},"idf_version":"v5.2.1","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > dist/${{ inputs.board }}_${{ inputs.channel_count }}ch/manifest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matter-panel_${{ inputs.board }}_${{ inputs.channel_count }}ch
          path: dist/${{ inputs.board }}_${{ inputs.channel_count }}ch/
